name: pretest_posttest_app
description: "Aplikasi Pre-Test & Post-Test Dasar Python untuk siswa."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.6.0
  audioplayers: ^6.7.1
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  open_filex: ^5.0.0
  web: ^1.1.1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  flutter_pdfview: ^1.4.5
  pdfx: ^2.11.0
  file_picker: ^13.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/images/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
          weight: 800
        - asset: assets/fonts/PlusJakartaSans-Italic-Variable.ttf
          weight: 400
          style: italic
